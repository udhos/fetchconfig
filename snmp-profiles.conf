# fetchconfig - SNMP inventory vendor profiles
#
# Optional. Augments/overrides the built-in enterprise->vendor registry used by
# fetchconfig::SNMPInventory to label a device when ENTITY-MIB entPhysicalMfgName
# is empty (e.g. Cisco, where only sysObjectID identifies the vendor).
#
# Matched most-specific-first: a full sysObjectID, then the longest sysObjectID
# prefix, then the SMI enterprise number (the integer after 1.3.6.1.4.1).
#
# Format:
#   vendor   <enterprise-number | sysObjectID | sysObjectID-prefix> <canonical name>
#   model    <sysObjectID | sysObjectID-prefix> <model name>
#   oid      <field> <enterprise | sysObjectID | prefix> <OID> [<regex>]
#   override <field> <enterprise | sysObjectID | prefix> <source> [<regex>]
#   members  <enterprise | sysObjectID | prefix> serial=<col> [model=<col>] [name=<col>] [os=<col>]
#
# Line syntax: one directive per line. Leading and trailing whitespace is ignored,
# and fields are whitespace-separated (a vendor/model name or a regex is read verbatim
# to the end of the line, so it may contain spaces). A line whose first non-blank
# character is "#" is a comment, and blank lines are skipped. There are NO inline
# comments: a "#" after a directive is part of the value, not a comment. A match token
# is read as an SMI enterprise number when it is all digits, otherwise as a
# sysObjectID / prefix when it is dotted-decimal. A line that matches no directive, or
# whose field name / OID / match token is malformed, is silently ignored (no error or
# warning) - so after adding a line, confirm it took effect with the profile section of
# tools/fc-snmp-inventory.pl.
#
# "vendor" labels a device when ENTITY-MIB entPhysicalMfgName is empty; matched
# most-specific-first (full sysObjectID, then longest prefix, then enterprise
# number). "model" (9.80) supplies a model name by sysObjectID, used only as a
# LAST-RESORT fallback when the ENTITY-MIB carries neither a model nor a descr
# for the primary chassis (e.g. the old menu-only ProCurve chassis); matched by
# full sysObjectID then longest prefix (no enterprise-number tier - a model is
# product-specific). Values are read verbatim to the end of the line (names may
# contain spaces).
#
# "oid" (9.80) supplies a headline field from a vendor PRIVATE MIB for devices
# that do NOT implement the ENTITY-MIB (1.3.6.1.2.1.47) at all but still answer
# the system group (e.g. Hirschmann). <field> is model, serial or os_version.
# <OID> is a plain GET of ONE instance - a scalar (.0) or a specific table row
# (e.g. ...9.1.3.1) - so give the fully-indexed OID. As an opt-in, an <OID> that
# ends in ".*" is a bare table-COLUMN base: the engine walks it (one GETNEXT) and
# takes the first row inside that column, so a MAC- or slot-indexed value needs no
# per-device index (e.g. Aruba aiAPSerialNum). The ".*" walk affects only the rule
# that carries it; every plain instance OID keeps its exact-GET behaviour. Matched
# most-specific-first like "vendor". The optional <regex> extracts from the raw
# value: its first capture group is used, else the whole value (a malformed
# pattern or a non-match leaves the field unset). "oid" fields are read only when
# ENTITY-MIB is absent, and only for fields still empty (ENTITY data always wins).
#
# "override" (9.80) REPLACES a present-but-wrong ENTITY value (e.g. a chipset
# codename like "Luton26" that a device reports in entPhysicalModelName). Unlike
# "oid" (which only FILLS an empty field on an ENTITY-less device), "override" wins
# over the ENTITY value. <field> is model, serial or os_version; matched
# most-specific-first like "vendor". <source> is either a numeric OID (a plain GET
# of one instance) or one of these symbols naming data already collected:
#   sysdescr   the system group sysDescr.0
#   entdescr   the primary chassis entPhysicalDescr
#   entmodel   the primary chassis entPhysicalModelName
#   entserial  the primary chassis entPhysicalSerialNum
# The optional <regex> extracts from the chosen source: its first capture group is
# used, else the whole value. A regex miss (or a bad pattern) leaves the ENTITY
# value in place - an override never blanks a field.
#
# "members" (9.80) records one chassis MEMBER per row of a vendor private-MIB table,
# like a stack, for a device that aggregates others - e.g. an Aruba virtual controller
# that lists its member APs in AI-AP-MIB aiAPTable. Each value is a table-COLUMN base:
# the engine walks the serial column (which enumerates the members) and joins the
# model/name/os columns by the same per-row index (a MAC), producing one chassis
# component per member (member_count, member_serials and hw_set follow). serial= is
# required; model=/name=/os= are optional. The member whose name matches the device's
# sysName (the controller's own entry) is the primary, and the headline serial is the
# primary's. Applied on the ENTITY-less path, like "oid".
#
# The common case needs no entry here - the built-in registries already cover
# the vendors and the two old HP chassis seen in the field. Add a line when a new
# vendor shows up as "unknown", or a new model as blank, in the inventory.
#
# Authoring tip: resolve a vendor's or product's private-MIB symbol to a numeric
# OID offline with net-snmp's `snmptranslate -On` or libsmi's `smidump`; the
# runtime only ever uses numeric OIDs.

# --- built-in vendor defaults (listed here for reference; also compiled in) ---
vendor 9      Cisco
vendor 11     HP
vendor 248    Hirschmann (Belden)
vendor 890    Zyxel Communications
vendor 10456  PLANET Technology Corporation
vendor 14823  Aruba Networks
vendor 25506  HPE Comware
vendor 47196  HPE Aruba Networking

# --- built-in model defaults (listed here for reference; also compiled in) ---
# The old ProCurve chassis report no model/serial in ENTITY-MIB; sysObjectID is
# the only reliable identifier. (sysObjectID 1.3.6.1.4.1.11.2.3.7.11.<n>.)
model 1.3.6.1.4.1.11.2.3.7.11.9  HP J4121A ProCurve Switch 4000M
model 1.3.6.1.4.1.11.2.3.7.11.7  HP J4110A ProCurve Switch 8000M

# --- Hirschmann classic switches (RS20/RS30/MACH, enterprise 248) -------------
# These implement no ENTITY-MIB; their identity lives in the private hmSysGroup
# (1.3.6.1.4.1.248.14.1.1). Headline fields only, read from slot 1:
#   model      <- hmSysGroupName       ...9.1.3.1    (e.g. "RS20-0400M2T1SDAEHH")
#   os_version <- hmSysVersion         ...1.1.2.0    ("SW: L2E-06.0.03 ..." -> L2E-06.0.03)
#   serial     <- hmSysGroupSerialNum  ...9.1.10.1   (confirmed against the MIB)
oid model      248  1.3.6.1.4.1.248.14.1.1.9.1.3.1
oid os_version 248  1.3.6.1.4.1.248.14.1.1.2.0  SW:\s*(\S+)
oid serial     248  1.3.6.1.4.1.248.14.1.1.9.1.10.1

# --- PLANET switches (enterprise 10456) ---------------------------------------
# PLANET devices implement the ENTITY-MIB, but some lines (e.g. the Vitesse
# "Luton26" reference design, IGS-5225 family) report the SoC codename in
# entPhysicalModelName instead of the product model. The real model is the 2nd
# comma-field of sysDescr ("PLANET, IGS-5225-8P4S, IE L2+ ..."), so override the
# ENTITY model with it. The regex captures the 2nd field (the capture is trimmed).
override model 10456  sysdescr  ^PLANET,\s*([^,]+)

# --- Zyxel switches (enterprise 890) ------------------------------------------
# Some Zyxel switches (e.g. the RGS200 family) implement no ENTITY-MIB chassis: a
# single entity of class "stack" carries the serial and OS, and the model is only
# in sysDescr (the bare model, e.g. "RGS200-12P"). The engine promotes a lone stack
# entity to a chassis (built in, vendor-neutral), so serial/OS are harvested; this
# override pulls the model from sysDescr when it is a single bare-model token. A
# richer multi-word sysDescr does not match, so the ENTITY value is kept instead.
override model 890    sysdescr  ^(\S+)$

# --- Aruba WLAN (AOS-8 / Instant APs & controllers, enterprise 14823) ----------
# These implement no ENTITY-MIB; only the system group answers reliably, so model/
# serial/OS are filled from the system group and the vendor private MIB (both the
# "override" and "oid" directives run on the ENTITY-less path):
#   model      <- sysDescr "(MODEL: nnn)" token ("AOS-8 (MODEL: 515), Version ...")
#   os_version <- built-in "Version ..." sysDescr heuristic (no rule needed)
#   serial     <- AI-AP-MIB aiAPSerialNum, a TABLE column indexed by the AP MAC
override model 14823  sysdescr  MODEL:\s*([^)]+)
#
# The serial is not in the system group; on Aruba it lives in a MAC-indexed private
# table (AI-AP-MIB aiAPTable). A virtual-controller AP lists ALL of its member APs
# there, so record each one as a chassis MEMBER (like a stack) with the "members"
# directive: give the serial/model/name table-COLUMN bases and the engine walks the
# serial column (which enumerates the members) and joins model/name by the per-row MAC
# index. The member whose name matches the device's sysName (the VC's own AP) is the
# primary; the headline serial is the primary's. One line fits the whole fleet.
#   aiAPSerialNum = ...2.3.3.1.2.1.1.4   aiAPModelName = ...6   aiAPName = ...2
members 14823  serial=1.3.6.1.4.1.14823.2.3.3.1.2.1.1.4  model=1.3.6.1.4.1.14823.2.3.3.1.2.1.1.6  name=1.3.6.1.4.1.14823.2.3.3.1.2.1.1.2
#
# (If a device exposes only a single serial in a table, not a member list, an
# "oid"/"override" OID ending in ".*" instead fetches just the first row as a scalar -
# e.g. a slot-indexed controller serial: oid serial 14823 <sysExtCardSerialNo-col>.* )
